[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "texaudit"
version = "0.2.1"
description = "Audit LaTeX, Word, and text manuscripts against journal requirements."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Suryodoy Ghoshal"}]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["latex", "docx", "manuscript", "journal", "word-count", "earth-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = ["PyYAML>=6.0", "python-docx>=1.1.2"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[project.urls]
Homepage = "https://github.com/thermok-SG/texaudit"
Repository = "https://github.com/thermok-SG/texaudit.git"
Issues = "https://github.com/thermok-SG/texaudit/issues"
Changelog = "https://github.com/thermok-SG/texaudit/releases"

[project.scripts]
texaudit = "texaudit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
texaudit = ["profiles/*.yaml", "profiles/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
